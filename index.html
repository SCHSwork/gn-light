<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GN Light</title>
<meta name="description" content="GN Light: the fast, lightweight version of GN 2.0. Free browser games, no ads, no accounts.">
<meta name="theme-color" content="#111318">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23fc2651'/%3E%3Ctext x='16' y='22' font-family='sans-serif' font-size='15' font-weight='800' fill='white' text-anchor='middle'%3EGN%3C/text%3E%3C/svg%3E">
<link rel="preload" href="games.json" as="fetch" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<style>
:root{--bg:#111318;--card:#1b1e26;--line:#2a2e39;--text:#e8eaf0;--muted:#9aa1b2;--accent:#fc2651;--cw:160px;--ch:150px;color-scheme:dark}
@media (prefers-color-scheme:light){:root{--bg:#f4f5f8;--card:#fff;--line:#dfe2ea;--text:#16181d;--muted:#5d6475;color-scheme:light}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;background:var(--bg);border-bottom:1px solid var(--line)}
h1{margin:0 6px 0 0;font-size:18px;font-weight:800;white-space:nowrap}
h1 b{color:var(--accent)}
input,select,button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
button{cursor:pointer}
button:hover,select:hover{border-color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#q{flex:1 1 180px;min-width:0}
#count{color:var(--muted);font-size:12px;white-space:nowrap}
#grid{position:relative;margin:12px}
.c{position:absolute;width:var(--cw);height:var(--ch);display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;text-decoration:none;color:inherit;contain:strict}
.c:hover{border-color:var(--accent)}
.c img{width:100%;flex:1;min-height:0;object-fit:cover;background:var(--line);display:block}
.c span{padding:6px 8px;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c i{position:absolute;top:4px;right:6px;font-style:normal;color:#facc15;text-shadow:0 0 3px #000}
#empty{display:none;margin:40px;text-align:center;color:var(--muted)}
#player{position:fixed;inset:0;z-index:10;display:none;flex-direction:column;background:#000}
#player.on{display:flex}
#bar{display:flex;gap:6px;align-items:center;padding:6px 8px;background:var(--bg);border-bottom:1px solid var(--line)}
#bar b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#frame{flex:1;border:0;width:100%;background:#000}
#msg{position:absolute;inset:50px 0 0;display:none;align-items:center;justify-content:center;color:#aaa}
footer{padding:16px 12px 24px;color:var(--muted);font-size:12px;text-align:center}
footer a{color:inherit}
@media (max-width:520px){:root{--cw:calc((100vw - 40px)/2);--ch:140px}h1{font-size:16px}}
</style>
</head>
<body>
<header>
  <h1>GN <b>Light</b></h1>
  <input id="q" type="search" placeholder="Search games" autocomplete="off" spellcheck="false" aria-label="Search games">
  <select id="src" aria-label="Source">
    <option value="all">All games</option>
    <option value="lib">Library</option>
    <option value="og">GN Originals</option>
    <option value="jam">js13k</option>
    <option value="fav">★ Favorites</option>
    <option value="recent">Recent</option>
  </select>
  <select id="sort" aria-label="Sort">
    <option value="az">A–Z</option>
    <option value="new">Newest</option>
  </select>
  <button id="rnd" title="Random game">🎲</button>
  <span id="count">Loading…</span>
</header>
<main id="grid" aria-live="polite"></main>
<p id="empty">No games match.</p>
<div id="player" role="dialog" aria-label="Game">
  <div id="bar">
    <b id="title"></b>
    <button id="favb" title="Favorite">☆</button>
    <button id="fsb" title="Fullscreen">⛶</button>
    <button id="tabb" title="Open in new tab">↗</button>
    <button id="closeb" title="Close (Esc)">✕</button>
  </div>
  <iframe id="frame" title="Game" allow="fullscreen; autoplay; gamepad" allowfullscreen></iframe>
  <div id="msg"></div>
</div>
<footer>GN Light: no ads, no accounts, nothing tracked. Games belong to their creators. <a href="https://schswork.github.io/math/">Full GN 2.0</a> · Press <kbd>`</kbd> to leave fast.</footer>
<script>
"use strict";
// ── Sources ──────────────────────────────────────────────────────────────────
// Same games as GN 2.0: the gn-math library plus GN Originals, each file tried
// on jsDelivr → GitHub → githack until one works.
const M = {
  jsd: (o, r, b, p) => `https://cdn.jsdelivr.net/gh/${o}/${r}@${b}/${p}`,
  gh:  (o, r, b, p) => `https://raw.githubusercontent.com/${o}/${r}/${b}/${p}`,
  hack:(o, r, b, p) => `https://rawcdn.githack.com/${o}/${r}/${b}/${p}`
};
const urls = (o, r, b, p) => [M.jsd(o, r, b, p), M.gh(o, r, b, p), M.hack(o, r, b, p)];
const OG = ["SCHSwork", "GN-originals", "main"];
// The game library is pinned to its last clean version: on Oct 11, 2026 every
// game file in its newest version had a malicious ad script added (commit ee1a41a).
const LIB = "48c0631289237dd2e9e202fde532edfae4ed2acf";
const BAD = [/data-r=["']c7a94e["']/i, /xa0f20fba9693cbb2c66516f1/, /__gnGameAd/];
const LS = {
  get(k, d) { try { const v = localStorage.getItem("gnl-" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("gnl-" + k, JSON.stringify(v)); } catch {} }
};
async function first(list, as = "json", ms = 12000) {
  let err;
  for (const u of list) {
    const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), ms);
    try {
      const r = await fetch(u, { signal: ctl.signal });
      if (!r.ok) throw new Error(r.status);
      const v = await r[as]();
      clearTimeout(t);
      return { v, u: r.url };
    } catch (e) { clearTimeout(t); err = e; }
  }
  throw err || new Error("no source");
}

// ── State ────────────────────────────────────────────────────────────────────
let all = [], view = [];
let favs = new Set(LS.get("favs", [])), recent = LS.get("recent", []);
const $ = id => document.getElementById(id);
const grid = $("grid"), q = $("q"), src = $("src"), sort = $("sort");
src.value = LS.get("src", "all"); sort.value = LS.get("sort", "az");
const norm = s => s.toLowerCase().replace(/[^a-z0-9]+/g, "");

// games.json rows: [id, name, kind, file, hasThumb, cover?]. Built daily by tools/build.py.
const KINDS = ["lib", "og", "jam"];
function fromRow(r) {
  const n = String(r[1]);
  return { id: String(r[0]), num: r[0], name: n, key: n.toLowerCase(), k2: norm(n), kind: KINDS[r[2]] || "lib", file: r[3], thumb: r[4], cover: r[5] || "" };
}
async function upstreamRows() {
  // Backup if games.json can't load: build the list from the original sources
  const lib = first(urls("freebuisness", "assets", "main", "zones.json")).then(r => r.v).catch(() => []);
  const og = first([M.gh, M.jsd, M.hack].map(f => f(...OG, "games.json"))).then(r => r.v).catch(() => []);
  const [L, O] = await Promise.all([lib, og]), rows = [], ids = new Set();
  for (const z of L) {
    if (!z || !z.name || /^\[!\]|comment|discord/i.test(z.name) || /^http/.test(z.url || "")) continue;
    rows.push([+z.id, z.name.trim(), 0, z.url.replace(/^\{HTML_URL\}\/?/, ""), 0, (z.cover || "").replace(/^\{COVER_URL\}\/?/, "")]); ids.add(+z.id);
  }
  for (const z of O) {
    if (!z || !z.name || z.libraryDuplicate || ids.has(+z.id) || typeof z.path !== "string" || /\.\./.test(z.path)) continue;
    rows.push([+z.id, z.name.trim(), (z.special || []).includes("js13k") ? 2 : 1, z.path, 0, z.cover || ""]);
  }
  return rows;
}
async function load() {
  // The saved list shows instantly; the fresh one replaces it when it arrives
  try { localStorage.removeItem("gnl-list"); } catch {}
  const cached = LS.get("rows", null);
  if (cached) { all = cached.map(fromRow); refresh(); }
  let rows = null;
  try { const r = await fetch("games.json"); if (r.ok) rows = await r.json(); } catch {}
  if (!Array.isArray(rows) || !rows.length) rows = await upstreamRows();
  if (rows.length) { all = rows.map(fromRow); LS.set("rows", rows); refresh(); }
  else if (!all.length) $("count").textContent = "Couldn't load games. Check your connection.";
}

// ── Filter, sort, search ─────────────────────────────────────────────────────
function refresh() {
  const s = q.value.trim().toLowerCase(), s2 = norm(s), mode = src.value;
  let list = all;
  if (mode === "fav") list = all.filter(z => favs.has(z.id));
  else if (mode === "recent") { const m = new Map(all.map(z => [z.id, z])); list = recent.map(id => m.get(id)).filter(Boolean); }
  else if (mode !== "all") list = all.filter(z => z.kind === mode);
  if (s) {
    const hits = list.filter(z => z.key.includes(s) || (s2 && z.k2.includes(s2)));
    // Nothing found? Allow typos: letters in order with gaps ("geomtrydash")
    list = hits.length || s2.length < 3 ? hits : list.filter(z => loose(z.k2, s2));
  }
  if (mode !== "recent") {
    list = list.slice();
    if (sort.value === "new") list.sort((a, b) => (a.kind !== "lib") - (b.kind !== "lib") || b.num - a.num);
    else list.sort((a, b) => a.key < b.key ? -1 : a.key > b.key ? 1 : 0);
    // Exact and starts-with matches first when searching
    if (s) list.sort((a, b) => rank(a, s) - rank(b, s));
  }
  view = list;
  $("count").textContent = view.length.toLocaleString() + " games";
  $("empty").style.display = view.length ? "none" : "block";
  layout(true);
}
function loose(k, s) {
  let i = 0, miss = 0;
  for (const ch of s) { const j = k.indexOf(ch, i); if (j === -1) { if (++miss > 1) return false; } else i = j + 1; }
  return true;
}
const rank = (z, s) => z.key === s ? 0 : z.key.startsWith(s) ? 1 : 2;
let qt;
q.addEventListener("input", () => { clearTimeout(qt); qt = setTimeout(refresh, 90); });
src.onchange = () => { LS.set("src", src.value); refresh(); };
sort.onchange = () => { LS.set("sort", sort.value); refresh(); };

// ── Virtual grid: only the cards on screen exist in the page ────────────────
let cols = 1, cw = 160, ch = 150, gap = 10, drawn = new Map(), raf = 0;
function measure() {
  const st = getComputedStyle(document.documentElement);
  const w = grid.clientWidth;
  cw = parseFloat(st.getPropertyValue("--cw")) || 160;
  if (/calc/.test(st.getPropertyValue("--cw"))) cw = (innerWidth - 40) / 2;
  ch = parseFloat(st.getPropertyValue("--ch")) || 150;
  cols = Math.max(1, Math.floor((w + gap) / (cw + gap)));
  cw = Math.floor((w - gap * (cols - 1)) / cols);
}
function layout(reset) {
  if (reset) { for (const el of drawn.values()) el.remove(); drawn.clear(); measure(); }
  grid.style.height = Math.ceil(view.length / cols) * (ch + gap) + "px";
  draw();
}
function draw() {
  raf = 0;
  const top = grid.getBoundingClientRect().top + scrollY;
  const y0 = scrollY - top - 400, y1 = scrollY - top + innerHeight + 400;
  const r0 = Math.max(0, Math.floor(y0 / (ch + gap))), r1 = Math.ceil(y1 / (ch + gap));
  const i0 = r0 * cols, i1 = Math.min(view.length, r1 * cols);
  for (const [i, el] of drawn) if (i < i0 || i >= i1) { el.remove(); drawn.delete(i); }
  const frag = document.createDocumentFragment();
  for (let i = i0; i < i1; i++) if (!drawn.has(i)) { const el = card(view[i], i); drawn.set(i, el); frag.appendChild(el); }
  grid.appendChild(frag);
}
function coverUrl(z) {
  // Small thumbnails hosted here (~4 KB) instead of the original covers (~200 KB)
  if (z.thumb) return "t/" + z.id + ".webp";
  if (!z.cover) return "";
  return z.kind === "lib" ? M.jsd("freebuisness", "covers", "main", z.cover) : M.jsd(...OG, z.cover);
}
function card(z, i) {
  const a = document.createElement("a");
  a.className = "c"; a.href = "#" + z.id; a.dataset.i = i;
  a.style.cssText = `width:${cw}px;height:${ch}px;transform:translate(${(i % cols) * (cw + gap)}px,${Math.floor(i / cols) * (ch + gap)}px)`;
  const img = new Image();
  img.loading = "lazy"; img.decoding = "async"; img.alt = ""; img.src = coverUrl(z);
  img.onerror = () => { img.onerror = null; img.removeAttribute("src"); };
  const s = document.createElement("span"); s.textContent = z.name;
  a.append(img, s);
  if (favs.has(z.id)) { const st = document.createElement("i"); st.textContent = "★"; a.appendChild(st); }
  return a;
}
addEventListener("scroll", () => { if (!raf) raf = requestAnimationFrame(draw); }, { passive: true });
let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => layout(true), 120); });
grid.addEventListener("click", e => {
  const a = e.target.closest(".c"); if (!a || e.ctrlKey || e.metaKey) return;
  e.preventDefault(); open(view[+a.dataset.i]);
});

// ── Player ───────────────────────────────────────────────────────────────────
const AD = /(^|\.)(googletagmanager\.com|google-analytics\.com|analytics\.google\.com|r9x\.in|googlesyndication\.com|doubleclick\.net|adnxs\.com|adsterra\.com|highperformanceformat\.com|effectivegatecpm\.com|profitableratecpm\.com|propellerads\.com|popads\.net|a-ads\.com)$/i;
function host(u) { try { return new URL(u, "https://x/").hostname; } catch { return ""; } }
function clean(html) {
  // Never run a game file that contains the known malicious script
  if (BAD.some(re => re.test(html))) throw Object.assign(new Error("blocked"), { blocked: true });
  // Some library files contain the page twice; the second copy crashes the game
  const e = html.search(/<\/html\s*>/i);
  if (e !== -1 && /<html\b/i.test(html.slice(e))) html = html.slice(0, e) + "</html>";
  html = html.replace(/<script\b([^>]*)>([\s\S]*?)<\/script\s*>/gi, (w, at, code) => {
    const s = (at.match(/\bsrc\s*=\s*["']?([^"'\s>]+)/i) || [])[1];
    if (s && AD.test(host(s))) return "";
    if (!s && (/r9x\.in/.test(code) || (code.length < 3000 && /gtag\(\s*['"](config|js)['"]|googletagmanager/.test(code)))) return "";
    if (!s && (code.match(/parseInt\(0x/g) || []).length >= 25 && /\.constructor\("return this"\)|randomUUID|new TextDecoder/.test(code)) return "";
    return w;
  });
  const guard = `<script>window.dataLayer=[];window.gtag=function(){};(function(){var b=${AD};function x(u){try{return b.test(new URL(u,location.href).hostname)}catch(e){return false}}[HTMLScriptElement,HTMLIFrameElement].forEach(function(C){var d=Object.getOwnPropertyDescriptor(C.prototype,"src");if(d&&d.set)Object.defineProperty(C.prototype,"src",{configurable:true,get:d.get,set:function(v){if(!x(v))d.set.call(this,v)}})})})();<\/script>`;
  return /<head\b[^>]*>/i.test(html) ? html.replace(/<head\b[^>]*>/i, m => m + guard) : guard + html;
}
function withBase(html, base) {
  html = html.replace(/<base\b[^>]*>/gi, "");
  const tag = `<base href="${base}"><style>:where(html){background:#fff;color:#000}</style><script>(function(){var d=Object.getOwnPropertyDescriptor(HTMLImageElement.prototype,"src");if(d&&d.set)Object.defineProperty(HTMLImageElement.prototype,"src",{configurable:true,get:d.get,set:function(v){try{if(this.crossOrigin===null&&!/^(data|blob):/.test(v))this.crossOrigin="anonymous"}catch(e){}d.set.call(this,v)}})})();<\/script>`;
  return /<head\b[^>]*>/i.test(html) ? html.replace(/<head\b[^>]*>/i, m => m + tag) : tag + html;
}
async function gameHtml(z) {
  if (z.kind === "lib") {
    return clean((await first(urls("freebuisness", "html", LIB, z.file), "text", 30000)).v);
  }
  const r = await first(urls(...OG, z.file), "text", 30000);
  const dir = z.file.includes("/") ? z.file.slice(0, z.file.lastIndexOf("/") + 1) : "";
  // GitHub serves scripts as plain text, so a page from GitHub loads its files via githack
  const base = /cdn\.jsdelivr\.net/.test(r.u) ? M.jsd(...OG, dir) : M.hack(...OG, dir);
  return withBase(clean(r.v), base);
}
// Start downloading a game as soon as you point at it, so it opens faster
const pre = new Map();
function fetchGame(z) {
  if (!pre.has(z.id)) {
    const p = gameHtml(z);
    p.catch(() => pre.delete(z.id));
    pre.set(z.id, p);
    if (pre.size > 6) pre.delete(pre.keys().next().value);
  }
  return pre.get(z.id);
}
let hov;
grid.addEventListener("pointerover", e => {
  const a = e.target.closest(".c"); clearTimeout(hov);
  if (a) hov = setTimeout(() => fetchGame(view[+a.dataset.i]), 120);
});
grid.addEventListener("pointerdown", e => { const a = e.target.closest(".c"); if (a) fetchGame(view[+a.dataset.i]); });
let cur = null, frame = $("frame");
function write(html) {
  // A fresh frame each time, so the last game's code stops completely
  const f = frame.cloneNode(); frame.replaceWith(f); frame = f;
  const d = f.contentDocument; d.open(); d.write(html); d.close();
}
async function open(z) {
  if (!z) return;
  cur = z;
  $("title").textContent = z.name; $("favb").textContent = favs.has(z.id) ? "★" : "☆";
  $("player").classList.add("on"); document.body.style.overflow = "hidden";
  const m = $("msg"); m.textContent = "Loading " + z.name + "…"; m.style.display = "flex";
  write("<body style='background:#000'></body>");
  recent = [z.id, ...recent.filter(id => id !== z.id)].slice(0, 40); LS.set("recent", recent);
  if (location.hash !== "#" + z.id) history.replaceState(null, "", "#" + z.id);
  try {
    const html = await fetchGame(z);
    if (cur !== z) return;
    m.style.display = "none"; write(html);
  } catch (e) {
    if (cur === z) m.textContent = e && e.blocked ? "This game was blocked to keep you safe. Its game files were found to contain malicious code (added to the outside game library on October 11), so it can't be played right now." : "Couldn't load this game. Try again in a minute.";
  }
}
function close() {
  cur = null; write(""); $("player").classList.remove("on"); document.body.style.overflow = "";
  history.replaceState(null, "", location.pathname + location.search);
  if (src.value === "recent") refresh();
}
$("closeb").onclick = close;
$("fsb").onclick = () => frame.requestFullscreen?.();
$("favb").onclick = () => {
  if (!cur) return;
  favs.has(cur.id) ? favs.delete(cur.id) : favs.add(cur.id);
  LS.set("favs", [...favs]); $("favb").textContent = favs.has(cur.id) ? "★" : "☆"; layout(true);
};
$("tabb").onclick = async () => {
  if (!cur) return; const w = window.open("about:blank");
  try { const h = await gameHtml(cur); w.document.open(); w.document.write(h); w.document.close(); } catch { w && w.close(); }
};
$("rnd").onclick = () => { const p = view.length ? view : all; open(p[Math.floor(Math.random() * p.length)]); };

// ── Keys: Esc closes, / searches, ` leaves fast ─────────────────────────────
function key(e) {
  if (e.key === "`") { e.preventDefault(); location.replace("https://classroom.google.com/"); }
  else if (e.key === "Escape" && cur && !document.fullscreenElement) close();
  else if (e.key === "/" && !cur && document.activeElement !== q) { e.preventDefault(); q.focus(); }
}
addEventListener("keydown", key, true);
setInterval(() => { try { const d = frame.contentDocument; if (d && !d.__k) { d.__k = 1; d.addEventListener("keydown", key, true); } } catch {} }, 1000);

load().then(() => {
  const id = location.hash.slice(1);
  if (id) open(all.find(z => z.id === id));
});
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>
</body>
</html>
